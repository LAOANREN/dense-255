name: Build Dense 255

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Accent color"
        type: choice
        options: [cyan, yellow, green, white]
        default: cyan
      language:
        description: "Labels: zh or en"
        type: choice
        options: [zh, en]
        default: zh
      slots:
        description: "Eight data slots, IDs 0-13"
        type: string
        default: "1,3,2,5,4,6,7,8"
      hours:
        description: "Clock format"
        type: choice
        options: ["24", "12"]
        default: "24"
      seconds:
        description: "Show seconds while awake"
        type: boolean
        default: true
      create_signing_key:
        description: "FIRST IQ BUILD ONLY: create key if no encrypted backup exists"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CIQ_IMAGE: ghcr.io/matco/connectiq-tester:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble project and validate resources
        env:
          FACE_THEME: ${{ inputs.theme }}
          FACE_LANGUAGE: ${{ inputs.language }}
          FACE_SLOTS: ${{ inputs.slots }}
          FACE_HOURS: ${{ inputs.hours }}
          FACE_SECONDS: ${{ inputs.seconds }}
        run: |
          mkdir -p out
          python prepare_project.py 2>&1 | tee out/prepare.log

      - name: Restore or create persistent signing key
        env:
          KEY_PASSWORD: ${{ secrets.CIQ_KEY_PASSWORD }}
          CREATE_KEY: ${{ inputs.create_signing_key }}
        run: |
          set -euo pipefail
          if [ "${#KEY_PASSWORD}" -lt 20 ]; then
            echo "::error::Set repository Actions secret CIQ_KEY_PASSWORD to a strong password of at least 20 characters."
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/ciq-signing"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          umask 077
          trap 'rm -f "$KEY_DIR/plain.pem"' EXIT
          if [ -f developer-key.encrypted.pem ]; then
            openssl pkcs8 -in developer-key.encrypted.pem \
              -passin env:KEY_PASSWORD -out "$KEY_DIR/plain.pem"
          elif [ "$CREATE_KEY" = "true" ]; then
            openssl genrsa -out "$KEY_DIR/plain.pem" 4096
            echo "::notice::New signing key created. Save the encrypted backup and upload it to the repository root before future builds."
          else
            echo "::error::Missing developer-key.encrypted.pem. Restore your backup; only for the FIRST IQ build enable create_signing_key."
            exit 1
          fi
          openssl pkey -in "$KEY_DIR/plain.pem" -check -noout
          openssl pkcs8 -topk8 -in "$KEY_DIR/plain.pem" \
            -outform DER -nocrypt -out "$KEY_DIR/developer_key.der"
          openssl pkcs8 -topk8 -in "$KEY_DIR/plain.pem" \
            -v2 aes-256-cbc -iter 200000 -passout env:KEY_PASSWORD \
            -out out/developer-key.encrypted.pem
          openssl pkey -in "$KEY_DIR/plain.pem" -pubout -outform DER \
            | openssl dgst -sha256 > out/signing-public-key.sha256

      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: Dense255-signing-backup
          path: |
            out/developer-key.encrypted.pem
            out/signing-public-key.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Obtain SDK image
        run: |
          docker pull "$CIQ_IMAGE" 2>&1 | tee out/sdk-download.log
          docker image inspect "$CIQ_IMAGE" --format '{{json .RepoDigests}}' > out/sdk-image-digest.txt

      - name: Compile PRG and export IQ
        run: |
          docker run --rm --user 0:0 --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/ciq-signing:/signing:ro" \
            -w /work/project \
            "$CIQ_IMAGE" -c '
              set -eu
              COMPILER=$(command -v monkeyc || true)
              if [ -z "$COMPILER" ]; then
                COMPILER=$(find / -type f -name monkeyc 2>/dev/null | head -n 1)
              fi
              if [ -z "$COMPILER" ]; then
                echo "No monkeyc found in SDK image."
                exit 1
              fi
              "$COMPILER" -f monkey.jungle -d fr255 \
                -y /signing/developer_key.der \
                -o /work/out/Dense255.prg -w
              "$COMPILER" -e -f monkey.jungle \
                -y /signing/developer_key.der \
                -o /work/out/Dense255.iq -w
            ' 2>&1 | tee out/compiler.log
          test -s out/Dense255.prg
          test -s out/Dense255.iq
          sha256sum out/Dense255.prg out/Dense255.iq > out/Dense255.sha256

      - name: Upload compiled PRG and IQ
        uses: actions/upload-artifact@v4
        with:
          name: Dense255-install-files
          path: |
            out/Dense255.prg
            out/Dense255.iq
            out/Dense255.sha256
            out/build-config.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs and assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dense255-source-and-logs
          path: |
            out/*.log
            out/*.txt
            out/Dense255-source.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ciq-signing/developer_key.der"
          rm -f "$RUNNER_TEMP/ciq-signing/plain.pem"
